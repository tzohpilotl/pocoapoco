name: Deploy Backend

on:
  workflow_run:
    workflows: ["Backend Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pocoapoco-tracking-service:latest
          cache-from: type=gha,scope=tracking-service
          cache-to: type=gha,mode=max,scope=tracking-service

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/pocoapoco/backend
            git pull
            docker compose pull
            docker compose up -d --remove-orphans
            # Kept even though tempo-app's own deploy has no migration step —
            # this is the template for tempo's eventual SQLite-to-Postgres
            # migration, so it stays even where tempo's current deploy doesn't need it.
            docker compose exec -T app npm run migration:run:prod
            docker image prune -f
